name: Pixel verification

on:
  push:
    branches: [main]
    paths: ["apps/editor/core.js", "runtime/**", "tests/**", "engine/**"]
  pull_request:
    paths: ["apps/editor/core.js", "runtime/**", "tests/**", "engine/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lvgl:
    name: LVGL ${{ matrix.lvgl }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lvgl: [v8.4.0, v9.2.2, v9.4.0, v9.6.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compile every export and compare pixels with the editor engine
        run: tests/verify.sh ${{ matrix.lvgl }}
      - name: Keep failing cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cases-${{ matrix.lvgl }}
          path: tests/cases
          retention-days: 7
