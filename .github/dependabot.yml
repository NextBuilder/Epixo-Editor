version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next-react-cloudflare:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "wrangler", "@opennextjs/cloudflare", "@cloudflare/*"]
      styling:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
